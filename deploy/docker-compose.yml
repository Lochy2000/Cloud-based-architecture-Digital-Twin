# https://docs.docker.com/compose/gettingstarted/#step-2-define-and-start-your-services
name: digital-twin

services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    profiles: ["c1"]
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
      - ./mosquitto/passwd:/mosquitto/passwd:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test:
        - CMD
        - mosquitto_pub
        - -h
        - localhost
        - -p
        - "8883"
        - --cafile
        - /mosquitto/certs/ca.crt
        - -u
        - twin
        - -P
        - ${BROKER_PASSWORD}
        - -q
        - "1"
        - -t
        - twin/healthcheck
        - -m
        - ready
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_INIT_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_INIT_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
      DOCKER_INFLUXDB_INIT_RETENTION: 90d
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.6
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  publisher:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "twin.publisher"]
    env_file:
      - ${ENV_FILE:-../config/env/c1.env}
    environment:
      MQTT_CLIENT_ID: twin-publisher-boiler_01
      ASSET_CONFIG_PATH: /app/config/assets/boiler_01.yaml
    volumes:
      - ../config/assets:/app/config/assets:ro
      - ./mosquitto/certs:/certs:ro
    depends_on:
      mosquitto:
        condition: service_healthy
        required: false
    restart: unless-stopped

  storage-writer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "twin.storage_writer"]
    env_file:
      - ${ENV_FILE:-../config/env/c1.env}
    environment:
      MQTT_CLIENT_ID: twin-storage-boiler_01
      ASSET_ID: boiler_01
    volumes:
      - ./mosquitto/certs:/certs:ro
    depends_on:
      mosquitto:
        condition: service_healthy
        required: false
      influxdb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mosquitto-data:
  influxdb-data:
  grafana-data:
