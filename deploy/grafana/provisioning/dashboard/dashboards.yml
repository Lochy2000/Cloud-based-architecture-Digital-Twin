# https://grafana.com/docs/grafana/latest/fundamentals/getting-started/first-dashboards/get-started-grafana-prometheus/
# https://grafana.com/docs/learning-paths/prometheus/ 
# https://grafana.com/docs/learning-paths/prom-remote-write/
apiVersion: 1

providers:
  - name: digital-twin
    orgId: 1
    folder: ""
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: false # do not want browser edits to survive a re - deploy.
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false